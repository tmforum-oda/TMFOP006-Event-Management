##############################################################################
# trapreceivercomponent -- Component CR (OPTIONAL / HOLD FOR NOW)
#
# ODA-compliant Component for the trapreceiver2 workload, built against the
# Component CRD (oda-component-crd.yaml, group oda.tmforum.org). Component
# type: Deployment -- this is a "published notification only" component. It
# declares no exposedAPIs / managementFunction / subscribedEvents: its sole
# purpose would be to register the alarmCreate/alarmClear notifications with
# whatever Component Operator is watching this namespace.
#
# `eventNotification.publishedEvents[].specification[]` fields and the
# `apiType` enum (openapi, mcp, a2a, sse -- no `topic` override field at this
# level) were confirmed directly against the live Component CRD on
# your target cluster via `kubectl explain component.spec.eventNotification.
# publishedEvents --recursive --api-version=oda.tmforum.org/v1`, and cross-
# checked against the real, already-reconciling `tmfc043-refimpl` Component
# in the `components` namespace. Confirmed admission-valid via
# `kubectl apply --dry-run=server` against that same cluster.
#
# DO NOT APPLY YET: the Component Operator (running in the `canvas`
# namespace, not covered by this repo) is what would turn this into its own
# auto-named PublishedNotification CR(s). Confirmed in practice on this
# cluster (not just suspected): applying an earlier, single-topic version of
# this Component CR caused the Component Operator to auto-create a second,
# differently-named PublishedNotification with its own unused topic
# (oda.trapreceiver1-trapreceivercomponent.alarmdetectedevent), alongside the
# one the standalone PublishedNotification CRs in 05b/05c already pin to the
# literal names oda.trapReceiver.event.alarmDetected / alarmCleared. Apply
# this only after confirming with whoever owns the Component Operator that it
# won't create colliding topics -- at that point, also delete 05b/05c to
# avoid duplicate PublishedNotification CRs for the same component.
##############################################################################
apiVersion: oda.tmforum.org/v1
kind: Component
metadata:
  name: trapreceivercomponent
  namespace: components
  labels:
    oda.tmforum.org/componentName: trapreceivercomponent
spec:
  componentMetadata:
    id: TRAPRECEIVER001
    name: TrapReceiverComponent
    version: "1.0.0"
    description: >-
      Publish-only ODA component for the trapreceiver2 workload: receives
      Zabbix alarm/clear traps over HTTP and republishes them as TMF642-style
      CloudEvents onto a single Kafka topic. No exposedAPIs -- this component
      exists only to register its published notification.
    publicationDate: "2026-10-30T00:00:00Z"
    status: specified
    functionalBlock: Production
    owners:
      - email: not-applicable-trapreceiver
        name: TrapReceiver Team
    maintainers:
      - name: TrapReceiver Team
        email: not-applicable-trapreceiver
    SID: []
    eTom: []
    functionalFramework: []
  coreFunction:
    exposedAPIs: []
    dependentAPIs: []
  eventNotification:
    publishedEvents:
      - name: alarmDetectedEvent
        description: >-
          Zabbix-sourced alarm raised event, republished as a TMF642
          AlarmCreate CloudEvent. Kafka topic: oda.trapReceiver.event.alarmDetected
        specification:
          - apiType: openapi
            hub: /api/v1
            implementation: trapreceiver2
            developerUI: /api/v1/health
            port: 8080
            url: https://example.com/asyncapi/trapreceiver-alarmdetected.json
            version: "1.0.0"
      - name: alarmClearEvent
        description: >-
          Zabbix-sourced alarm cleared event, republished as a TMF642
          AlarmClear CloudEvent. Kafka topic: oda.trapReceiver.event.alarmCleared
        specification:
          - apiType: openapi
            hub: /api/v1
            implementation: trapreceiver2
            developerUI: /api/v1/health
            port: 8080
            url: https://example.com/asyncapi/trapreceiver-alarmcleared.json
            version: "1.0.0"
    subscribedEvents: []
