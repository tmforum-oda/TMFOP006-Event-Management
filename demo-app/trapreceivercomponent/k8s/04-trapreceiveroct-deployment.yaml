##############################################################
# Deployment + Services: trapreceiver2
# Image: <your-registry>/trapreceiver2:1.0.0
# Namespace: trapreceiver2  (ZERO impact to existing trapreceiver namespace)
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trapreceiver2
  namespace: trapreceiver2
  labels:
    app: trapreceiver2
    version: "1.0.0"
    component: trap-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trapreceiver2
  template:
    metadata:
      labels:
        app: trapreceiver2
        version: "1.0.0"
    spec:
      imagePullSecrets:
      - name: dockerhub-secret

      # ── Init container: install kafka-python into shared volume ──────────
      initContainers:
      - name: install-kafka-python
        image: python:3.11-slim
        command:
          - sh
          - -c
          - |
            echo "=== kafka-config env ==="
            echo "  KAFKA_LIBS_PATH      = ${KAFKA_LIBS_PATH}"
            echo "  KAFKA_PYTHON_VERSION = ${KAFKA_PYTHON_VERSION}"
            echo "  KAFKA_BOOTSTRAP      = ${KAFKA_BOOTSTRAP_SERVERS}"
            echo "=== Installing kafka-python==${KAFKA_PYTHON_VERSION} -> ${KAFKA_LIBS_PATH} ==="
            pip install --quiet --target "${KAFKA_LIBS_PATH}" "kafka-python==${KAFKA_PYTHON_VERSION}"
            echo "=== Install complete. Packages: ==="
            ls "${KAFKA_LIBS_PATH}" | head -10
        envFrom:
          - configMapRef:
              name: kafka-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
          - name: kafka-libs
            mountPath: /kafka-libs

      # ── Main container ────────────────────────────────────────────────────
      containers:
      - name: trapreceiver2
        image: jiotmraj/trapreceiveroct:1.0.0
        imagePullPolicy: Always
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        env:
          - name: CONFIG_PATH
            value: /app/config/config.yaml
          - name: PORT
            value: "8080"
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: TRAP_API_KEY
            valueFrom:
              secretKeyRef:
                name: trapreceiver2-auth
                key: TRAP_API_KEY
          - name: DASHBOARD_API_KEY
            valueFrom:
              secretKeyRef:
                name: trapreceiver2-auth
                key: DASHBOARD_API_KEY
        envFrom:
          - configMapRef:
              name: kafka-config
          - secretRef:
              name: trapreceiver2-kafka-creds
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
          - name: config-volume
            mountPath: /app/config
          - name: kafka-libs
            mountPath: /kafka-libs

      volumes:
        - name: config-volume
          configMap:
            name: trapreceiver2-config
        - name: kafka-libs
          emptyDir: {}
---
##############################################################
# Service: trapreceiver2-svc (ClusterIP — internal access)
##############################################################
apiVersion: v1
kind: Service
metadata:
  name: trapreceiver2-svc
  namespace: trapreceiver2
  labels:
    app: trapreceiver2
    component: trap-receiver
spec:
  type: ClusterIP
  selector:
    app: trapreceiver2
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
##############################################################
# Service: trapreceiver2-ext-svc (LoadBalancer — PUBLIC access)
# This gives a new public ELB URL — existing trapreceiver ELB untouched
##############################################################
apiVersion: v1
kind: Service
metadata:
  name: trapreceiver2-ext-svc
  namespace: trapreceiver2
  labels:
    app: trapreceiver2
    component: trap-receiver
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "classic"
spec:
  type: LoadBalancer
  selector:
    app: trapreceiver2
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
