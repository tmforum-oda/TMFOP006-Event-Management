##############################################################
# Secret: trapreceivercomponent-kafka-creds (REDACTED TEMPLATE)
# Kafka SASL credentials. Replace the placeholder values below with your
# own base64-encoded credentials before applying -- e.g.:
#   echo -n '<your-username>' | base64
#   echo -n '<your-password>' | base64
# Real values for the live deployment are rotated and stored outside git
# (see README "Secrets" section) -- never commit real values here.
##############################################################
apiVersion: v1
kind: Secret
metadata:
  name: trapreceivercomponent-kafka-creds
  namespace: components
  labels:
    app: trapreceivercomponent
    component: kafka
type: Opaque
data:
  KAFKA_SASL_USERNAME: "<base64-encoded-username>"
  KAFKA_SASL_PASSWORD: "<base64-encoded-password>"
---
##############################################################
# Secret: trapreceivercomponent-auth (REDACTED TEMPLATE)
# API keys for the trapreceiveroct HTTP API. Replace the placeholder values
# below with your own base64-encoded keys before applying.
##############################################################
apiVersion: v1
kind: Secret
metadata:
  name: trapreceivercomponent-auth
  namespace: components
  labels:
    app: trapreceivercomponent
    component: auth
type: Opaque
data:
  TRAP_API_KEY: "<base64-encoded-api-key>"
  DASHBOARD_API_KEY: "<base64-encoded-dashboard-key>"
