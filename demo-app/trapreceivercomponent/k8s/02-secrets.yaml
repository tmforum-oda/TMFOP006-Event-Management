##############################################################
# Secret: trapreceiver2-kafka-creds (REDACTED TEMPLATE)
# Kafka SASL credentials. Replace the placeholder values below with your
# own base64-encoded credentials before applying -- e.g.:
#   echo -n '<your-username>' | base64
#   echo -n '<your-password>' | base64
##############################################################
apiVersion: v1
kind: Secret
metadata:
  name: trapreceiver2-kafka-creds
  namespace: trapreceiver2
  labels:
    app: trapreceiver2
    component: kafka
type: Opaque
data:
  KAFKA_SASL_USERNAME: "<base64-encoded-username>"
  KAFKA_SASL_PASSWORD: "<base64-encoded-password>"
---
##############################################################
# Secret: trapreceiver2-auth (REDACTED TEMPLATE)
# API keys for the trapreceiveroct HTTP API. Replace the placeholder values
# below with your own base64-encoded keys before applying.
##############################################################
apiVersion: v1
kind: Secret
metadata:
  name: trapreceiver2-auth
  namespace: trapreceiver2
  labels:
    app: trapreceiver2
    component: auth
type: Opaque
data:
  TRAP_API_KEY: "<base64-encoded-api-key>"
  DASHBOARD_API_KEY: "<base64-encoded-dashboard-key>"
