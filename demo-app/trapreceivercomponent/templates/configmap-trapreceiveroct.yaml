apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-trapreceiveroct-config
  labels:
    app: {{ .Release.Name }}-trapreceiveroct
    oda.tmforum.org/componentName: {{ .Release.Name }}-{{ .Values.component.name }}
data:
  config.yaml: |
    # =============================================================
    # TrapReceiveroct - Application Configuration
    # =============================================================

    # TMF642-required fields are REQUIRED here, not defaulted in code --
    # app.py returns 400 if the sender omits any of these, instead of the
    # app inventing a value (see trap_receiver/transformer.py).
    validation:
      common_required:
        - correlation_id
      action_required:
        create:
          - externalAlarmId
          - alarmRaisedTime
          - alarmType
          - probableCause
          - alarmedObjectType
          - alarmedObject
          - sourceSystemId
          - state
          - severity
        clear:
          - recovery_event_id
          - alarmClearedTime
          - alarmPattern
          - clearSystemId
          - clearUserId

    type_action_map:
      Alarm:      create
      ClearAlarm: clear

    kafka:
      producer:
        acks: "all"
        retries: 3
        linger_ms: 5
        request_timeout_ms: 10000
        max_block_ms: 10000
      cloudevent_headers:
        - id
        - source
        - type
        - time
        - specversion
        - datacontenttype
        - correlationid

    # Zabbix's own severity vocabulary -> TMF642 perceivedSeverity. The
    # payload must set `severity` to one of these keys (validated in app.py);
    # the mapped value becomes perceivedSeverity -- never hardcoded.
    severity_map:
{{- range $key, $value := .Values.alarm.severityMap }}
      {{ $key | quote }}: {{ $value | quote }}
{{- end }}

    # Only structural/formatting defaults -- no TMF642 alarm data is
    # invented here. object_type backs the @type discriminator only if a
    # caller somehow omits @type (real traffic always has it, since it's
    # how the action itself is inferred). alarm_details_prefix only affects
    # formatting of a detail string the payload already provided.
    alarm_defaults:
      object_type:          "Alarm"
      alarm_details_prefix: "Operational data"

    cloudevent:
      spec_version:         "1.0"
      data_content_type:    "application/json"
      payload_category:     "asyncapi"
      id_template:          "evt-{cid}-{action}"
      source_template:      "/zabbix/{source_type}/{cid}"
      type_template:        "org.tmforum.tmf642.alarm.{action}"
      data_schema_template: "{{ .Values.eventNotification.create.specificationUrl }}#/components/messages/{MessageName}"

    asyncapi:
      version:      "3.1.0"
      info_version: "5.0.1"

    # Separate topic per TMF642 action. Registered via the standalone
    # PublishedNotification CRs (k8s/05b-*-detected.yaml, 05c-*-clear.yaml),
    # NOT via this chart's Component -- its eventNotification.publishedEvents
    # is deliberately empty (see templates/component-trapreceivercomponent.yaml).
    action_map:
      create:
        message_name:    "AlarmCreate"
        channel_name:    "alarmCreate"
        operation_name:  "createAlarm"
        source_type:     "problem"
        asyncapi_title:  "TMF642 Alarm Create"
        channel_address: {{ .Values.eventNotification.create.topic | quote }}
      clear:
        message_name:    "AlarmClear"
        channel_name:    "alarmClear"
        operation_name:  "clearAlarm"
        source_type:     "recovery"
        asyncapi_title:  "TMF642 Alarm Clear"
        channel_address: {{ .Values.eventNotification.clear.topic | quote }}

    # Which HTTP paths need which API key -- auth.py reads this instead of
    # hardcoding route sets. /dashboard itself is open (its own JS supplies
    # a key when it calls the two JSON endpoints below).
    auth:
      trap_paths:
        - /api/v1/trap
        - /api/v1/trap/alarm
        - /api/v1/trap/clear
      dashboard_paths:
        - /api/v1/events
        - /api/v1/events/summary
      open_paths:
        - /api/v1/health
        - /dashboard
