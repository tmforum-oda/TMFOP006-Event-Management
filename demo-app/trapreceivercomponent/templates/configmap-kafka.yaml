apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-trapreceiveroct-kafka-config
  labels:
    app: {{ .Release.Name }}-trapreceiveroct
    oda.tmforum.org/componentName: {{ .Release.Name }}-{{ .Values.component.name }}
  annotations:
    description: >-
      Non-secret Kafka infrastructure env vars. SASL credentials are in the
      pre-existing Secret named by .Values.kafka.existingSecretName -- not
      created by this chart.
data:
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}
  KAFKA_SASL_MECHANISM: {{ .Values.kafka.saslMechanism | quote }}
  KAFKA_SECURITY_PROTOCOL: {{ .Values.kafka.securityProtocol | quote }}
