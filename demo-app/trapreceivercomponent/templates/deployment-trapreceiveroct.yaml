##############################################################################
# Deployment + Services: trapreceiveroct
# Implementation referenced by this chart's Component CR
# (eventNotification.publishedEvents[0].specification[0].implementation).
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-trapreceiveroct
  labels:
    app: {{ .Release.Name }}-trapreceiveroct
    version: {{ .Values.component.version | quote }}
    oda.tmforum.org/componentName: {{ .Release.Name }}-{{ .Values.component.name }}
spec:
  replicas: {{ .Values.trapreceiveroct.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-trapreceiveroct
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-trapreceiveroct
        version: {{ .Values.component.version | quote }}
    spec:
      # -- Init container: install kafka-python into a shared volume -- #
      initContainers:
        - name: install-kafka-python
          image: python:3.11-slim
          command:
            - sh
            - -c
            - |
              pip install --quiet --target "${KAFKA_LIBS_PATH}" "kafka-python==${KAFKA_PYTHON_VERSION}"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-trapreceiveroct-kafka-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: kafka-libs
              mountPath: /kafka-libs

      # -- Main container -- #
      containers:
        - name: trapreceiveroct
          image: {{ .Values.trapreceiveroct.image }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ .Values.trapreceiveroct.port }}
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: /app/config/config.yaml
            - name: PORT
              value: {{ .Values.trapreceiveroct.port | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TRAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecretName }}
                  key: TRAP_API_KEY
            - name: DASHBOARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecretName }}
                  key: DASHBOARD_API_KEY
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-trapreceiveroct-kafka-config
            - secretRef:
                name: {{ .Values.kafka.existingSecretName }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.trapreceiveroct.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.trapreceiveroct.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
            - name: kafka-libs
              mountPath: /kafka-libs

      volumes:
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-trapreceiveroct-config
        - name: kafka-libs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-trapreceiveroct
  labels:
    app: {{ .Release.Name }}-trapreceiveroct
    oda.tmforum.org/componentName: {{ .Release.Name }}-{{ .Values.component.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-trapreceiveroct
  ports:
    - name: http
      port: {{ .Values.trapreceiveroct.port }}
      targetPort: {{ .Values.trapreceiveroct.port }}
      protocol: TCP
