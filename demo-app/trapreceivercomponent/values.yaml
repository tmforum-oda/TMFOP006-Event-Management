# Default values for trapreceivercomponent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

component:
  id: TRAPRECEIVER001
  name: trapreceivercomponent
  functionalBlock: Production
  publicationDate: 2026-10-30T00:00:00.000Z
  version: "1.0.0"

# -- The published notifications this component registers -- one topic per
# TMF642 action, matching the detected/cleared naming Zabbix is configured
# against. `topic` is what the Event Management Operator provisions on Kafka.
# NOTE: the standard Component CRD's eventNotification.publishedEvents has no
# `topic` override field (confirmed via `kubectl explain` against
# your target cluster) -- the Component Operator derives its own topic name
# from this Component CR. Until that derivation is confirmed to produce the
# exact names below, the guaranteed-literal-name path is the standalone
# PublishedNotification CRs this chart does NOT create (kept as
# trapreceivercomponent/k8s/05b-*-detected.yaml and 05c-*-clear.yaml) --
# see this chart's README for details.
eventNotification:
  create:
    topic: oda.trapReceiver.event.alarmDetected
    specificationUrl: https://example.com/asyncapi/trapreceiver-alarmdetected.json
    specificationVersion: "1.0.0"
  clear:
    topic: oda.trapReceiver.event.alarmCleared
    specificationUrl: https://example.com/asyncapi/trapreceiver-alarmcleared.json
    specificationVersion: "1.0.0"

trapreceiveroct:
  image: jiotmraj/trapreceivercomponent:1.0.0
  port: 8080
  replicas: 1
  # Public endpoint for Zabbix to POST alarms to. Cloud-agnostic: creates a
  # real load balancer in whatever cloud the cluster this is installed on
  # runs in (a billed resource there) -- an AWS ELB on EKS, a GCP Load
  # Balancer on GKE, an Azure LB on AKS. On a cluster with no cloud
  # load-balancer controller (e.g. local kind/minikube) it stays <pending>
  # instead -- use `kubectl port-forward` there, or set `enabled: false`.
  externalAccess:
    enabled: true
    # Optional cloud-specific Service annotations, e.g. to request a
    # particular AWS load balancer type:
    #   annotations:
    #     service.beta.kubernetes.io/aws-load-balancer-type: "classic"
    annotations: {}

# -- Kafka producer settings (infra, non-secret) --
# REQUIRED: this chart does NOT provision a Kafka cluster. You must already
# have one running and reachable from wherever you install this, and point
# bootstrapServers at it -- the default below is an internal DNS name from
# the cluster this chart was originally built against and will not resolve
# anywhere else. Override with `--set kafka.bootstrapServers=<your-broker>:9092`
# or your own values file.
kafka:
  bootstrapServers: oda-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  saslMechanism: SCRAM-SHA-512
  securityProtocol: SASL_PLAINTEXT
  libsPath: /kafka-libs
  pythonVersion: "2.0.2"
  # Name of a pre-existing Secret (same namespace) with keys
  # KAFKA_SASL_USERNAME / KAFKA_SASL_PASSWORD. Not created by this chart.
  existingSecretName: trapreceiver2-kafka-creds

# -- HTTP API auth (non-Kafka) --
auth:
  # Name of a pre-existing Secret (same namespace) with keys
  # TRAP_API_KEY / DASHBOARD_API_KEY. Not created by this chart.
  existingSecretName: trapreceiver2-auth

# -- Published-event payload shaping (Zabbix -> TMF642 CloudEvent) --
alarm:
  sourceSystemId: zabbix
  severityMap:
    Disaster: critical
    High: major
    Average: minor
    Warning: warning
    Info: indeterminate
    Not classified: indeterminate
